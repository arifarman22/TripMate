version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://tripmate:${DB_PASSWORD}@db:5432/tripmate
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRE=15m
      - JWT_REFRESH_EXPIRE=7d
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tripmate-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=tripmate
      - POSTGRES_USER=tripmate
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - tripmate-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripmate"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  tripmate-network:
    driver: bridge
